#
# RTL lint gate: 3.build/hw_build.openXC7/run-lint.sh on top, chip and simulation
# views with eduBOS5 (the default CPU), chip view with PicoRV32; phases tags,
# verilator, yosys and slang. The verible phase is gated in verible.yml.
# Tools come from the OSS CAD Suite (Yosys with the yosys-slang plugin,
# Verilator).

name: lint

on:
  push:
  pull_request:

jobs:
  run-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install OSS CAD Suite (Yosys + yosys-slang, Verilator)
        uses: YosysHQ/setup-oss-cad-suite@v4

      - name: Tool versions
        run: |
          yosys -V
          verilator --version

      - name: run-lint (chip view)
        env:
          YOSYS_ARGS: -m slang
          LINT_WORK: ${{ runner.temp }}/lint/chip
        run: bash 3.build/hw_build.openXC7/run-lint.sh tags verilator yosys slang

      - name: run-lint (simulation view)
        if: always()
        env:
          YOSYS_ARGS: -m slang
          LINT_WORK: ${{ runner.temp }}/lint/sim
          VIEW: sim
        run: bash 3.build/hw_build.openXC7/run-lint.sh tags verilator yosys slang

      - name: run-lint (PicoRV32, chip view)
        if: always()
        env:
          YOSYS_ARGS: -m slang
          LINT_WORK: ${{ runner.temp }}/lint/picorv32
          CPU: picorv32
        run: bash 3.build/hw_build.openXC7/run-lint.sh tags verilator yosys slang

      - name: Keep the lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: ${{ runner.temp }}/lint
